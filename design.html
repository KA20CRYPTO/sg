<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenerPro Auth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: #1f2937;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .vibrant-bg-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      filter: blur(80px);
    }
    .bg-blob {
      position: absolute; width: 500px; height: 500px;
      border-radius: 50%; opacity: 0.5;
      animation: move-blob 20s infinite;
    }
    .blob-1 { background: #a855f7; top: -100px; left: -100px; animation-delay: -3s; }
    .blob-2 { background: #8b5cf6; bottom: -150px; right: -150px; animation-delay: -7s; }
    .blob-3 { background: #3b82f6; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -12s; }

    @keyframes move-blob {
      0%,100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(200px,-100px) scale(1.1); }
      50% { transform: translate(-150px,200px) scale(0.9); }
      75% { transform: translate(100px,150px) scale(1.2); }
    }

    .glassy-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.45), 0 0 20px rgba(99,102,241,0.45);
      width: 400px;
      max-width: 95%;
      margin: auto;
      position: relative;
      z-index: 10;
    }
    .form-container {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <!-- Animated blobs -->
  <div class="vibrant-bg-container">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>
  </div>

  <!-- Glassy card -->
  <div class="glassy-card">
    <div class="text-center mb-6">
      <h1 id="form-title" class="text-3xl font-bold mb-2 text-white">Welcome</h1>
      <p id="form-subtitle" class="text-gray-300">Please login or sign up to continue</p>
    </div>
    <!-- Placeholder where Streamlit will inject its form -->
    <div id="streamlitForm"></div>
  </div>
</body>
</html>
